name: refresh-composer-lock

on:
  push:
    branches:
      - audit/production-hardening-20261016

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/production-hardening-20261016
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - name: Configure Flux credentials
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"
      - name: Update locked PHP dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Audit updated dependencies
        run: composer audit --locked --no-interaction
      - name: Commit refreshed Composer lockfile
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "build: refresh Composer lock"
          git push
